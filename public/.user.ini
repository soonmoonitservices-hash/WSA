; PHP-Einstellungen für dieses Verzeichnis (Hostinger/LiteSpeed, PHP-FPM).
; Wird über .htaccess vor Aufrufen von außen geschützt.

; Schutz vor PHP2Shell (CVE-2026-109618/-109619): empfohlene Übergangsmaßnahme.
; Das Formular nutzt keine Sessions und keine Uploads.
session.upload_progress.enabled = 0

; Kleine Anfragen genügen (Formular max. 20 KB)
post_max_size = 64K
max_input_vars = 30

; Keine Fehlermeldungen an Besucher ausgeben
display_errors = Off
log_errors = On
